# Sobe o laboratório completo: banco, API e frontend.
#   cp .env.example .env && docker compose up --build
# Frontend: http://localhost:3000 · API: http://localhost:8000/docs

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: lab
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD no .env}
      POSTGRES_DB: lab
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lab -d lab"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped
    # Sem "ports": o banco só é acessível pela rede interna do compose

  api:
    build: ./backend
    environment:
      ENVIRONMENT: ${ENVIRONMENT:-development}
      DATABASE_URL: postgresql+psycopg://lab:${POSTGRES_PASSWORD}@db:5432/lab
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000}
      IP_HASH_SALT: ${IP_HASH_SALT:?defina IP_HASH_SALT no .env}
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"
    restart: unless-stopped

  web:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: ${PUBLIC_API_URL:-http://localhost:8000}
    environment:
      API_URL: http://api:8000
    depends_on:
      - api
    ports:
      - "3000:3000"
    restart: unless-stopped

volumes:
  pgdata:

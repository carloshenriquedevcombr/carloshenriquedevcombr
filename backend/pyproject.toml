[project]
name = "lab-api"
version = "0.1.0"
description = "API do portfólio 'The Lab' — Carlos Henrique"
requires-python = ">=3.12"

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "SIM"]
ignore = ["B008"]  # Depends() em argumentos padrão é idiomático no FastAPI

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.bandit]
exclude_dirs = ["tests", "alembic"]

[tool.ruff.lint.isort]
known-third-party = ["alembic"]
